name: unit_converter
description: "A professional unit converter application."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1               # Updated for compatibility
  shared_preferences: ^2.2.3  # Updated for compatibility
  google_mobile_ads: ^5.1.0   # <--- ADDED THIS LINE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/Logo.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#007AFF" 
  adaptive_icon_foreground: "assets/Logo.png"